<!doctype html>
<html lang="zh-CN">
<head>
    <meta name="playroom-embedded" content="js-solitaire">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#008080">
    <title>经典纸牌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: none">
    <div class="window">
        <div class="window__inner">
            <div class="window__heading">
                <div class="window__heading-icon"></div>
                经典纸牌
            </div>
            <div class="window__actions">
                <button type="button" id="js-reset" class="new-game" title="快捷键 N">新游戏</button>
                <button type="button" id="js-hint" class="new-game" title="快捷键 H">提示</button>
                <span class="game-stat">步数 <strong id="js-moves">0</strong></span>
                <span class="game-stat">时间 <strong id="js-time">00:00</strong></span>
                <span id="js-status" class="game-status" aria-live="polite">移动红黑相间的降序牌列</span>
            </div>
            <div class="window__content">
                <div class="window__content-inner">
                    <div class="solitaire" id="js-solitaire">
                        <div id="js-finish" class="finish-deck"></div>
                        <div id="js-board" class="board-deck"></div>

                        <div class="deck">
                            <div id="js-deck-pile" class="deck__pile"></div>
                            <div id="js-deck-deal" class="deck__deal"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="main.js"></script>
</body>
</html>
