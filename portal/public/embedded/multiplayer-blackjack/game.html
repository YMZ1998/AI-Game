<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>多人二十一点房间</title>
    <link rel="stylesheet" type="text/css" href="css/game.css" />
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
  </head>
  <body>
      <hr />
      <h1 class="blackjack" id="bj">多人二十一点</h1>
      <div class="waiting">

      <h2 class="roomHeading" id="waitingrooom">等待其他玩家</h2>
      <h2 class="roomHeading" id="roomid">房间号</h2>
      
      <div class="centerAlign text-center" style="margin-top: 40px;">
        <ul class="list-group">
            <li class="list-group-item active">玩家</li>
            </li>
        </ul>
        <button class="btn btn-lg btn-warning login d-none centerAlignBtn" id="startBtnContainer" style="margin-top: 20px;">开始游戏</button>
    </div>
  </div>
    <div class="the-reveal" style="display:none">
      <div class="connected white martop">在线玩家：<span id="players"></span></div>
      <hr />
      <div id="winner" class="white"></div>
      <br /><br />
      <div id="left" class="col-lg-8 left">
        <!-- dealer -->
        <div id="dealer"></div>
        <span id="d_score" class="white marbot"></span>
        <br />
        <div id="dealerCard">
          <img src="./images/new_card_back_4.png" class="small cardbg" alt="">
        </div>
        <br /><br />
        <!-- player -->
        <button class="btn btn-info btn-sm" id="hit">要牌</button>
        <button class="btn btn-basic btn-sm" id="stand">停牌</button>
        <!-- <button class="btn btn-danger btn-sm" id="new">New Game</button> -->
        <br><br>
        <span id="score" class="white martop"></span>
        <br /><br />
        <div id="player" class="white">
            <img src="./images/new_card_back_4.png" class="small cardbg" alt="">
        </div>
        
      </div>
      <!-- chat -->
      <div class="col-lg-4 right">
        <p>
        <b><span id="user" class="white"></span></b>
        </p>
        <ul id="messages"></ul>
        <form class="the-reveal">
          <label class="sr-only" for="m">聊天消息</label>
          <input class="msg" id="m" autocomplete="off" maxlength="160" placeholder="发送桌边消息" />
          <button class="btn btn-primary btn-sm">发送</button>
        </form>
      </div>
    </div>
      
      

    <script src="vendor/qs.js"></script>
    <script src="/multiplayer-blackjack-service/socket.io/socket.io.js"></script>
    <script src="vendor/jquery.min.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
