<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racez.io</title>
    <script type="module" crossorigin src="./assets/game-DM9Nhvbs.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/GLTFLoader-BwMWDfuw.js">
    <link rel="stylesheet" crossorigin href="./assets/game-CNX8W6Fa.css">
  </head>
  <body>
    <!-- Rotate Message -->
    <div id="rotate-message">
      <div class="rotate-content">
        <i class="fas fa-sync-alt rotate-icon"></i>
        <p>Please Rotate to Landscape</p>
      </div>
    </div>

    <!-- Loading Screen - Add this at the top of body -->
    <div id="loading-screen">
      <h1 class="loading-title">RACEZ.IO</h1>
      <div class="loader-container">
        <div class="loader">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>
    
    <div id="app"></div>
    <div id="racing-ui">
      <div id="speedometer">
        <div class="gauge">
          <div class="gauge-body">
            <div class="gauge-fill"></div>
            <div class="gauge-cover"></div>
            <div class="gauge-needle"></div>
          </div>
          <div class="speed-value">0</div>
          <div class="speed-unit">KPH</div>
        </div>
      </div>
    </div>
    <a href="index.html" class="exit-game-btn" aria-label="Return to lobby">
      <i class="fas fa-door-open"></i>
    </a>
  </body>
</html>
