<!DOCTYPE html>
<html>
  <head>
    <title>Trigger Rally</title>
    <meta name="description" content="Fast arcade rally racing action! Play in your browser with WebGL 3D graphics.">
    <link rel="stylesheet" href="css/unified.css">
    <!--<link rel="icon" href="/favicon.png">-->
  </head>
  <body>
    <div id="unified-container"></div><img src="images/icon-128.png" style="display:none" title="Trigger Rally icon">
    <script>
      const launchParams = new URLSearchParams(location.search);
      const autoStart = launchParams.get("autostart") === "1";
      let initialPath;
      if (autoStart) {
        launchParams.delete("autostart");
        const remainingSearch = launchParams.toString();
        const basePath = location.pathname.endsWith("/index.html")
          ? location.pathname.slice(0, -"index.html".length)
          : location.pathname.replace(/\/?$/, "/");
        initialPath =
          basePath +
          "track/RF87t6b6/drive" +
          (remainingSearch ? "?" + remainingSearch : "");
        history.replaceState(
          null,
          "",
          basePath
        );
      } else if (location.pathname.endsWith("/index.html")) {
        history.replaceState(
          null,
          "",
          location.pathname.slice(0, -"index.html".length) +
            location.search +
            location.hash
        );
      }
      window.__INITIAL_PATH__ =
        sessionStorage.redirect ||
        initialPath ||
        (location.pathname + location.search + location.hash);
      delete sessionStorage.redirect;
      window.require = {
      urlArgs: "v=20260730-renderfix17"
      };
    </script>
    <script data-main="scripts/main" src="js/require.js"></script>
  </body>
</html>
